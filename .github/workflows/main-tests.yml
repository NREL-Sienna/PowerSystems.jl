name: Main - CI

on:
  schedule:
  - cron: "0 0 * * 1-5"
  push:
    branches:
      - main

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1', 'nightly']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: ""
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.julia-version == 'nightly' }}
        env:
          PYTHON: ""
      # Report coverage from a single job. Uploading all six matrix legs sent
      # duplicate reports per commit, including from nightly runs whose tests
      # were allowed to fail.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      # Hard-fail on upload errors. A silent `false` here let uploads 404 for
      # three months (2026-04-17 onward) while CI stayed green.
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
