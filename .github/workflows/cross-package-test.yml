name: CrossPackageTest

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: Julia v${{ matrix.julia-version }} - ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1]
        os: [ubuntu-latest]
        package_name: [PowerSimulations, PowerSystemCaseBuilder, PowerNetworkMatrices, PowerFlows]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clone ${{matrix.package_name}}
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/${{matrix.package_name}}.jl
          path: downstream
      - name: Run the tests
        shell: julia --project=downstream {0}
        run: |
          using Pkg
          try
            # Force it to use this PR's version of the package
            Pkg.develop(PackageSpec(path="."))
            Pkg.update()
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            # Failing to resolve THIS package into the downstream project means we
            # are incompatible by SemVer, which is fine: it says we correctly marked
            # this as a breaking change rather than introducing one by mistake.
            @info "Not compatible with this release. No problem." exception=err
            exit(0)  # Exit immediately, as a success
          end
          # Deliberately outside the catch above. A resolver error here comes from the
          # downstream package's own test dependencies, not from an intentional
          # breaking change here, so it must fail loudly instead of reporting success.
          Pkg.test()
