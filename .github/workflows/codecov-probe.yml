name: Codecov Token Check

# TEMPORARY validation workflow — delete once coverage reporting is confirmed.
#
# Uploads a synthetic lcov report so the Codecov auth path can be verified in
# seconds instead of waiting ~45 minutes for the real test suite.
#
# Run it (manually) right after setting the repo-level CODECOV_TOKEN secret:
#   gh workflow run codecov-probe.yml --ref jd/restore-codecov
#
# Green  => the token is valid and coverage reporting is restored.
# 404    => the token still does not resolve to Sienna-Platform/PowerSystems.jl.
#
# The upload lands under the `probe` flag so it does not disturb the real
# `unittests` coverage numbers.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report the token situation
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "CODECOV_TOKEN is present (length ${#TOKEN})"
          else
            echo "CODECOV_TOKEN is EMPTY or unset"
          fi

      - name: Synthesize a minimal lcov report
        run: |
          cat > lcov.info <<'EOF'
          TN:
          SF:src/PowerSystems.jl
          DA:1,1
          DA:2,1
          DA:3,0
          LF:3
          LH:2
          end_of_record
          EOF
          cat lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          disable_search: true
          flags: probe
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
